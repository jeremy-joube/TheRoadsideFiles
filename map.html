<!DOCTYPE html>
<html lang="fr"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title _msttexthash="128271" _msthash="0">The Roadside Files</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icon.png">
  <!-- Fallback for older browsers -->
  <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
  <!-- Apple Touch Icon -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.png">
  <script src="visitor-counter.js"></script>
  <script src="map.js" defer></script>  
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      color: #d4c7a1;
      font-family: Courier New, monospace;
      background-image: url('https://www.transparenttextures.com/patterns/asfalt-dark.png');
    }
    
    .map-container {
        position: relative;
        width: 95%;
        max-width: 1400px;
        margin: 40px auto;
        border: 1px solid #5d513e;
        box-shadow: 0 0 35px rgba(0,0,0,0.8);
        background: #201e1a;
        overflow: hidden;
    }


    /* =========================
       HEADER
    ========================= */

    .map-header {
        padding: 18px 25px;
        background: rgba(20,18,15,0.95);
        border-bottom: 1px solid #5d513e;
        text-align: center;
    }

    .map-header h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 4px;
        text-transform: uppercase;
        font-weight: normal;
    }

    .map-header p {
        margin: 8px 0 0;
        font-size: 13px;
        color: #93866b;
        letter-spacing: 1px;
    }


    /* =========================
       MAP
    ========================= */

    .map {
        position: relative;
        width: 100%;
        aspect-ratio: 16 / 9;

        background-image:
            linear-gradient(
                rgba(30,25,18,0.12),
                rgba(30,25,18,0.12)
            ),
            url("0- USA Carte.jpg");

        background-size: cover;
        background-position: center;

        filter: sepia(15%);
    }


    /* =========================
       CASE MARKERS
    ========================= */

    .case-marker {
        position: absolute;

        width: 18px;
        height: 18px;

        transform: translate(-50%, -50%);

        border-radius: 50%;

        background: #8e1d18;

        border: 2px solid #d7c59b;

        box-shadow:
            0 0 0 2px rgba(40,30,20,0.8),
            0 0 15px rgba(120,20,10,0.6);

        cursor: pointer;

        transition:
            transform 0.2s ease,
            box-shadow 0.2s ease;
    }

    .case-marker:hover {
        transform: translate(-50%, -50%) scale(1.35);

        box-shadow:
            0 0 0 2px #d7c59b,
            0 0 25px rgba(160,30,20,0.9);
    }


    /* =========================
       PULSE
    ========================= */

    .case-marker::after {
        content: "";

        position: absolute;

        top: 50%;
        left: 50%;

        width: 100%;
        height: 100%;

        border-radius: 50%;

        transform: translate(-50%, -50%);

        border: 1px solid #a82a20;

        animation: pulse 2.5s infinite;

        pointer-events: none;
    }

    @keyframes pulse {

        0% {
            transform: translate(-50%, -50%) scale(1);
            opacity: 0.8;
        }

        100% {
            transform: translate(-50%, -50%) scale(2.5);
            opacity: 0;
        }

    }


    /* =========================
       CASE WINDOW
    ========================= */

    .case-info {

        position: absolute;

        min-width: 250px;
        max-width: 320px;

        padding: 18px;

        background:
            linear-gradient(
                rgba(35,31,25,0.97),
                rgba(25,23,19,0.97)
            );

        border: 1px solid #796b50;

        box-shadow: 0 10px 30px rgba(0,0,0,0.7);

        display: none;

        z-index: 10;
    }

    .case-info.active {
        display: block;
    }

    .case-info h2 {
        margin: 0 0 8px;

        font-size: 19px;

        color: #d9c79c;

        font-weight: normal;

        text-transform: uppercase;

        letter-spacing: 1px;
    }

    .case-info .location {
        font-size: 12px;

        color: #918269;

        text-transform: uppercase;

        letter-spacing: 1px;
    }

    .case-info p {
        font-size: 13px;

        line-height: 1.5;

        color: #c5b99c;
    }

    .case-info a {

        display: inline-block;

        margin-top: 8px;

        padding: 7px 12px;

        border: 1px solid #75664c;

        color: #d9c79c;

        text-decoration: none;

        font-size: 12px;

        text-transform: uppercase;

        letter-spacing: 1px;

        transition: background 0.2s;
    }

    .case-info a:hover {
        background: #4a4031;
    }


    /* =========================
       LEGEND
    ========================= */

    .map-legend {

        position: absolute;

        bottom: 20px;
        left: 20px;

        background: rgba(20,18,15,0.9);

        border: 1px solid #675a44;

        padding: 12px 15px;

        font-size: 12px;

        color: #b9aa8b;
    }

    .legend-dot {

        display: inline-block;

        width: 9px;
        height: 9px;

        background: #8e1d18;

        border-radius: 50%;

        margin-right: 6px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

        .map-container {
            width: 100%;
            margin: 0;
            border: none;
        }

        .map-header h1 {
            font-size: 20px;
        }

        .case-info {
            min-width: 200px;
            max-width: 240px;
        }

    }

    
    @media (max-width: 900px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  
  <!-- ========================================= -->
  <!-- HEADER -->
  <!-- ========================================= -->
  <div id="header-placeholder"></div>
  <!-- ========================================= -->
  <!-- MAIN -->
  <!-- ========================================= -->
  
  <div class="container">
    
    <!-- SIDEBAR -->
    <div id="sidebar-placeholder"></div>
    
    <!-- MAIN CONTENT -->
    <main>
      
        <div class="map-container">

            <div class="map-header">
        
                <h1>Carte</h1>
        
                <p>
                    ÉVÉNEMENTS INEXPLIQUÉS À TRAVERS LES ÉTATS-UNIS
                </p>
        
            </div>
        
        
            <div class="map" id="map">
        
        
                <!-- =====================================
                     CASE 0 — THE HORNED MAN - MARYLAND
                ====================================== -->
        
                <div
                    class="case-marker"
                    style="left: 85%; top: 45%;"
                    data-case="the-horned-man">
                </div>

                <!-- =====================================
                    CASE 0 — WHERE ROADS MEET - VERMONT
                ====================================== -->
   
                <div
                    class="case-marker"
                    style="left: 87%; top: 21%;"
                    data-case="rituel">
                </div>
                        
        
                <!-- =====================================
                     CASE X — NORTH CAROLINA
                ====================================== -->
        
                <div
                    class="case-marker"
                    style="left: 77.5%; top: 58%;"
                    data-case="logan-mercer">
                </div>
        
        
                <!-- =====================================
                     CASE X — LOUISIANA
                ====================================== -->
        
                <div
                    class="case-marker"
                    style="left: 63%; top: 86%;"
                    data-case="bayou">
                </div>
        
        
                <!-- =====================================
                     CASE x — CHICAGO
                ====================================== -->
        
                <div
                    class="case-marker"
                    style="left: 65.3%; top: 38%;"
                    data-case="dragon">
                </div>
        
        
                <!-- =====================================
                     INFORMATION WINDOW
                ====================================== -->
        
                <div class="case-info" id="caseInfo">
        
                    <h2 id="caseTitle">
                        Case
                    </h2>
        
                    <div class="location" id="caseLocation">
                        LOCATION
                    </div>
        
                    <p id="caseDescription">
                        Description
                    </p>
        
                    <a
                        id="caseLink"
                        href="#"
                        target="_self">
        
                        LIRE LE DOSSIER
        
                    </a>
        
                </div>
        
        
                <!-- =====================================
                     LEGEND
                ====================================== -->
        
                <div class="map-legend">
        
                    <span class="legend-dot"></span>
        
                    Cas documenté
        
                </div>
        
            </div>
        
        </div>
        <div id="footer-placeholder"></div>
    </main>
    
  </div>
  
  
</body></html>
